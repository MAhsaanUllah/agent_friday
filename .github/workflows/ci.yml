name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest mypy
      - name: Type check (mypy)
        run: python -m mypy --ignore-missing-imports --python-version 3.11 app api
      - name: Tests (pytest)
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests -q -o faulthandler_timeout=120
