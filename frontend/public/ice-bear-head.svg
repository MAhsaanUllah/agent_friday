<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Ice Bear Passport Headshot (Matching User's Geometry with 3D Gradients) -->
  <defs>
    <radialGradient id="polarBodyGradHead" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
  </defs>

  <!-- Transform to scale and center the head portion of the body -->
  <g transform="translate(10, 10) scale(0.65)">
    <!-- Ears -->
    <circle cx="55" cy="45" r="18" fill="url(#polarBodyGradHead)" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="145" cy="45" r="18" fill="url(#polarBodyGradHead)" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="55" cy="45" r="10" fill="#f8fafc" opacity="0.8" />
    <circle cx="145" cy="45" r="10" fill="#f8fafc" opacity="0.8" />

    <!-- Main Head Shape -->
    <path
      fill="url(#polarBodyGradHead)"
      stroke="#cbd5e1"
      stroke-width="2"
      d="M 45,70 C 45,20 155,20 155,70 C 155,110 170,150 170,180 L 30,180 C 30,150 45,110 45,70 Z"
    />

    <!-- Eyes -->
    <circle cx="78" cy="95" r="5" fill="#0f172a" />
    <circle cx="122" cy="95" r="5" fill="#0f172a" />
    
    <!-- Blush -->
    <circle cx="68" cy="108" r="8" fill="#f43f5e" opacity="0.2" />
    <circle cx="132" cy="108" r="8" fill="#f43f5e" opacity="0.2" />

    <!-- Nose & Mouth -->
    <ellipse cx="100" cy="108" rx="14" ry="10" fill="#0f172a" />
    <ellipse cx="97" cy="105" rx="4" ry="2.5" fill="#ffffff" opacity="0.6" />
    <path d="M 93,122 Q 100,117 107,122" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
