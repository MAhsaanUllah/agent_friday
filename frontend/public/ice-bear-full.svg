<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" fill="none">
  <!-- Ice Bear Full Body (3D Style) -->
  <defs>
    <!-- 3D Body Gradient -->
    <radialGradient id="bodyGrad" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="90%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </radialGradient>
    <!-- Arm Gradient -->
    <radialGradient id="armGrad" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </radialGradient>
    <!-- Nose Shadow -->
    <radialGradient id="noseGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="50%" stop-color="#111"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>

  <!-- Cute Round Tail -->
  <path d="M170 196 C182 196 186 208 182 216 C178 222 170 222 162 218" fill="url(#bodyGrad)" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round"/>

  <!-- Main Body & Head Outline (No harsh black strokes for 3D look) -->
  <path d="M68 28
           C84 28 106 42 124 70
           C144 102 164 150 168 198
           C172 238 164 262 152 276
           L152 308
           C152 314 144 316 136 316
           C126 316 122 310 122 302
           L124 278
           L94 278
           L94 308
           C94 314 86 316 78 316
           C66 316 64 310 64 302
           L66 268
           C40 252 26 218 26 170
           C26 126 36 96 46 82
           C30 76 20 62 22 46
           C24 34 38 30 52 34
           C58 30 64 28 68 28Z"
        fill="url(#bodyGrad)"/>
        
  <!-- Soft Inner Shadow for Depth -->
  <path d="M68 28 C84 28 106 42 124 70 C144 102 164 150 168 198 C172 238 164 262 152 276" fill="none" stroke="#fff" stroke-width="4" opacity="0.6" stroke-linecap="round"/>

  <!-- Left Ear -->
  <path d="M64 28 C62 16 74 12 82 16 C88 19 89 25 87 32" fill="url(#bodyGrad)"/>
  <path d="M64 28 C62 16 74 12 82 16" fill="none" stroke="#fff" stroke-width="2" opacity="0.8"/>
  
  <!-- Right Ear -->
  <path d="M100 34 C104 22 114 18 120 22 C126 26 126 34 122 42" fill="url(#bodyGrad)"/>
  <path d="M100 34 C104 22 114 18 120 22" fill="none" stroke="#fff" stroke-width="2" opacity="0.8"/>

  <!-- Back Paw Toes (Soft creases) -->
  <path d="M130 316 L130 308" stroke="#a0a0a0" stroke-width="2" stroke-linecap="round"/>
  <path d="M142 316 L142 308" stroke="#a0a0a0" stroke-width="2" stroke-linecap="round"/>
  <!-- Front Paw Toes -->
  <path d="M72 316 L72 308" stroke="#a0a0a0" stroke-width="2" stroke-linecap="round"/>
  <path d="M84 316 L84 308" stroke="#a0a0a0" stroke-width="2" stroke-linecap="round"/>

  <!-- Arm / Front Paw -->
  <!-- We add a drop shadow to the arm to separate it from the body in 3D -->
  <path d="M96 122
           L96 212
           C96 230 114 234 122 227
           C128 220 130 204 132 120"
        fill="url(#armGrad)"
        filter="drop-shadow(-3px 5px 4px rgba(0,0,0,0.15))"/>
        
  <!-- Claw lines -->
  <path d="M110 232 L112 222" stroke="#909090" stroke-width="2" stroke-linecap="round"/>
  <path d="M120 230 L122 220" stroke="#909090" stroke-width="2" stroke-linecap="round"/>

  <!-- Black Oval Nose on 3/4 Snout (3D shading) -->
  <ellipse cx="42" cy="54" rx="13" ry="8" fill="url(#noseGrad)"/>
  <!-- Nose highlight -->
  <ellipse cx="38" cy="52" rx="4" ry="2" fill="#fff" opacity="0.4"/>

  <!-- Two Cute Black Dot Eyes -->
  <circle cx="56" cy="42" r="3.5" fill="#111"/>
  <circle cx="92" cy="44" r="3.5" fill="#111"/>

  <!-- Subtle Neutral Mouth Expression -->
  <path d="M50 76 Q56 74 60 76" stroke="#444" stroke-width="2" stroke-linecap="round"/>
</svg>
