<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Clean Dark Badge -->
  <rect width="120" height="120" rx="28" fill="#0C1017"/>
  <rect x="2" y="2" width="116" height="116" rx="26" stroke="#1B2333" stroke-width="2"/>

  <!-- Left Ear -->
  <path d="M34 32 C30 18 44 14 50 20 C54 24 53 30 50 36" fill="#FFFFFF" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Ear -->
  <path d="M86 32 C90 18 76 14 70 20 C66 24 67 30 70 36" fill="#FFFFFF" stroke="#111827" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Head & Shoulders Silhouette -->
  <path d="M38 34
           C48 24 72 24 82 34
           C94 46 98 68 104 120
           L16 120
           C22 68 26 46 38 34Z"
        fill="#FFFFFF"
        stroke="#111827"
        stroke-width="3.5"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Left Ear Inner Arc -->
  <path d="M39 23 C42 21 46 22 47 26" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <!-- Right Ear Inner Arc -->
  <path d="M81 23 C78 21 74 22 73 26" stroke="#111827" stroke-width="2" stroke-linecap="round"/>

  <!-- Two Black Dot Eyes -->
  <circle cx="46" cy="58" r="3.2" fill="#111827"/>
  <circle cx="74" cy="58" r="3.2" fill="#111827"/>

  <!-- Center Black Oval Nose -->
  <ellipse cx="60" cy="67" rx="8" ry="5.5" fill="#111827"/>

  <!-- Cute Neutral Mouth Line -->
  <path d="M57 78 Q60 80 63 78" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
</svg>
